[package]
name = "anyx-lsp"
version.workspace = true
edition.workspace = true
description = "A language server for any anyx grammar: diagnostics, completion, formatting and folding from a generated decoder"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
anyx = { path = "../anyx" }
lsp-server = "0.7"
lsp-types = "0.95"
serde = "1"
serde_json = "1"
wasm-bindgen = { version = "0.2.100", optional = true }

[features]
## Exports the server to JavaScript, to run in a browser: see `wasm!`.
wasm = ["dep:wasm-bindgen"]

[[example]]
name = "poentaro-lsp"
path = "examples/poentaro/main.rs"

[dev-dependencies]
lsp-server = "0.7"
serde_json = "1"
